services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholarquest
      POSTGRES_PASSWORD: scholarquest
      POSTGRES_DB: scholarquest
    ports:
      - "5432:5432"
    volumes:
      - scholarquest_pgdata:/var/lib/postgresql/data

volumes:
  scholarquest_pgdata:
